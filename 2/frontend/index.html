<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат - Главная</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="loading">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>
    </div>

    <script>
        // Проверяем наличие токена при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            
            if (token) {
                // Если есть токен, проверяем его валидность
                fetch('http://localhost:3000/api/verify-token', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = 'chat.html';
                    } else {
                        localStorage.removeItem('token');
                        window.location.href = 'login.html';
                    }
                })
                .catch(() => {
                    // Если сервер недоступен, всё равно перенаправляем на логин
                    window.location.href = 'login.html';
                });
            } else {
                // Если нет токена, идем на страницу входа
                window.location.href = 'login.html';
            }
        });
    </script>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .loading {
            text-align: center;
            color: white;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading p {
            font-size: 18px;
            margin: 0;
        }
    </style>
</body>
</html>
