<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Chat Room</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h2>Chat Room</h2>
                <div class="chat-mode" id="chatMode">
                    <span class="mode-indicator">🌐 Public Chat</span>
                </div>
            </div>
            <div class="user-info">
                <div class="avatar-container" id="userAvatar">
                    <span class="avatar-emoji">😊</span>
                    <div class="avatar-dropdown" id="avatarDropdown">
                        <h4>Quick Actions</h4>
                        <a href="profile.html" class="dropdown-item">👤 Profile Settings</a>
                        <a href="create-group.html" class="dropdown-item">👥 Create Group</a>
                        <div class="dropdown-item" id="showCustomEmojis">✨ My Custom Emojis</div>
                    </div>
                </div>
                <span id="usernameDisplay"></span>
                <button id="logoutBtn" class="btn btn-danger">Logout</button>
            </div>
        </div>
        
        <div class="chat-main">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-tabs">
                    <button class="tab-btn active" data-tab="users">👥 Users</button>
                    <button class="tab-btn" data-tab="groups">👥 Groups</button>
                </div>
                
                <div class="tab-content active" id="usersTab">
                    <div class="user-filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="online">Online</button>
                    </div>
                    <ul id="usersList"></ul>
                </div>
                
                <div class="tab-content" id="groupsTab">
                    <button class="create-group-btn" onclick="window.location.href='create-group.html'">
                        + Create New Group
                    </button>
                    <ul id="groupsList"></ul>
                </div>
            </div>
            
            <div class="conversation-area">
                <div class="conversation-header" id="conversationHeader">
                    <div class="chat-info">
                        <span class="chat-avatar" id="currentChatAvatar">🌐</span>
                        <span id="currentChatName">Public Chat</span>
                        <span id="currentChatStatus"></span>
                    </div>
                    <div class="chat-actions" id="chatActions"></div>
                </div>
                
                <div class="messages-area" id="messagesArea">
                    <div id="messages"></div>
                    <div class="typing-indicator" id="typingIndicator" style="display: none;">
                        <span></span><span></span><span></span>
                    </div>
                </div>
                
                <div class="message-input">
                    <div class="emoji-picker-trigger" id="emojiPickerTrigger">😊</div>
                    <input type="text" id="messageInput" placeholder="Type your message...">
                    <button id="sendBtn" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-picker-header">
            <input type="text" id="emojiSearch" placeholder="Search emojis...">
        </div>
        <div class="emoji-categories">
            <button class="category-btn active" data-category="default">😊 Default</button>
            <button class="category-btn" data-category="custom">✨ Custom</button>
        </div>
        <div class="emoji-list" id="emojiList">
            <!-- Emojis will be loaded here -->
        </div>
    </div>
    
    <div class="modal" id="customEmojisModal">
        <div class="modal-content">
            <h3>My Custom Emojis</h3>
            <div class="custom-emojis-grid" id="customEmojisGrid"></div>
            <button class="btn btn-secondary" onclick="closeCustomEmojisModal()">Close</button>
        </div>
    </div>
    
    <script src="js/chat.js"></script>
</body>
</html>
