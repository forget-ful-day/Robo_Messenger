<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <h2>Profile Settings</h2>
                <a href="chat.html" class="btn btn-secondary">Back to Chat</a>
            </div>

            <div class="profile-content">
                <div class="profile-avatar-section">
                    <div class="current-avatar" id="currentAvatar">😊</div>
                    <h3 id="profileUsername">Username</h3>
                </div>

                <div class="profile-sections">
                    <div class="profile-section danger-zone">
                        <h3 class="danger-text">Danger Zone</h3>
                        <p>Delete account if you no longer want to use this chat.</p>
                        <button id="deleteAccountBtn" class="btn btn-danger">Delete My Account</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>Confirm Account Deletion</h3>
            <p>Are you sure you want to delete your account? This action cannot be undone.</p>
            <p>All your messages will be anonymized and your profile will be permanently removed.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Yes, Delete My Account</button>
            </div>
        </div>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
